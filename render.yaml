services:
  - type: web
    name: konekta
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: MONGO_URI
        sync: false
      - key: UPLOAD_DIR
        value: /var/data/uploads
    disk:
      name: konekta-uploads
      mountPath: /var/data
      sizeGB: 1
